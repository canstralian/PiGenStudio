# Analytics Module Configuration
# This file contains configuration settings for the analytics module

# Enable or disable metrics collection
COLLECT_METRICS=true

# Alert Thresholds
TEMPERATURE_THRESHOLD=70    # CPU temperature in °C
MEMORY_THRESHOLD=85         # Memory usage percentage
CPU_THRESHOLD=80            # CPU usage percentage

# Storage Configuration
REPORTS_DIR=/var/log/analytics
LOG_FILE=/var/log/analytics/analytics.log

# Data Retention
# Number of days to keep old metrics (used with cleanup command)
METRICS_RETENTION_DAYS=30

# Scheduling
# To run metrics collection automatically, add to crontab:
# */15 * * * * /usr/local/bin/analytics.sh collect >> /var/log/analytics/cron.log 2>&1
#
# Daily cleanup at 3 AM:
# 0 3 * * * /usr/local/bin/analytics.sh cleanup >> /var/log/analytics/cron.log 2>&1

# Export Format
# Default export format for metrics (json, csv)
DEFAULT_EXPORT_FORMAT=csv

# Notification Settings (future enhancement)
# ENABLE_EMAIL_ALERTS=false
# ALERT_EMAIL=admin@example.com
# ENABLE_WEBHOOK_ALERTS=false
# WEBHOOK_URL=
